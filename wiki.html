<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="COLORS 공식 게임 위키 — 캐릭터, 전투, 맵, 상점, 시즌 정보를 한곳에서 확인하세요.">
  <title>COLORS 위키</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./wiki.css?v=1">
</head>
<body>
  <a class="skip-link" href="#wiki-main">본문으로 건너뛰기</a>
  <header class="wiki-header">
    <a class="brand" href="/wiki/" aria-label="COLORS 위키 홈">
      <span class="brand-mark">C</span>
      <span><strong>COLORS</strong><small data-t="wiki">게임 위키</small></span>
    </a>
    <nav class="top-nav" aria-label="주요 메뉴">
      <button class="nav-link active" data-route="home" data-t="home">홈</button>
      <button class="nav-link" data-route="characters" data-t="characters">캐릭터</button>
      <button class="nav-link" data-route="systems" data-t="systems">게임 가이드</button>
      <button class="nav-link" data-route="shop" data-t="shop">상점</button>
      <button class="nav-link" data-route="patches" data-t="patches">패치노트</button>
    </nav>
    <div class="header-actions">
      <button id="lang-button" class="icon-button" type="button" aria-label="언어 변경">EN</button>
      <a class="play-button" href="/index.html" data-t="play">게임 플레이</a>
    </div>
  </header>

  <main id="wiki-main">
    <section class="hero">
      <div class="hero-art" aria-hidden="true">
        <span class="orb orb-red"></span><span class="orb orb-cyan"></span><span class="orb orb-yellow"></span>
      </div>
      <div class="hero-copy">
        <p class="eyebrow" data-t="official">OFFICIAL GAME WIKI</p>
        <h1 data-t="heroTitle">전장에 들어가기 전,<br><em>모든 색을 알아보세요.</em></h1>
        <p data-t="heroDesc">캐릭터 능력치부터 전투 규칙, 맵과 시즌 업데이트까지 COLORS의 모든 정보를 한곳에서 확인하세요.</p>
        <form id="search-form" class="hero-search" role="search">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" autocomplete="off" data-t-placeholder="searchPlaceholder" placeholder="캐릭터, 스킬, 맵을 검색하세요">
          <kbd>/</kbd>
        </form>
        <div id="search-results" class="search-results hidden" aria-live="polite"></div>
        <div class="quick-links">
          <button data-open="char:red">Red</button>
          <button data-open="char:cyan">Cyan</button>
          <button data-route="systems" data-t="battleRules">전투 규칙</button>
          <button data-route="patches">v1.4.14</button>
        </div>
      </div>
    </section>

    <section class="content-shell">
      <aside class="category-rail" aria-label="위키 카테고리">
        <p data-t="categories">카테고리</p>
        <button class="rail-link active" data-route="home"><span>⌂</span><span data-t="home">홈</span></button>
        <button class="rail-link" data-route="characters"><span>◆</span><span data-t="characters">캐릭터</span><b>8</b></button>
        <button class="rail-link" data-route="systems"><span>◎</span><span data-t="systems">게임 가이드</span><b>6</b></button>
        <button class="rail-link" data-route="shop"><span>◈</span><span data-t="shop">상점</span><b>7</b></button>
        <button class="rail-link" data-route="patches"><span>▤</span><span data-t="patches">패치노트</span></button>
        <div class="source-note">
          <span class="live-dot"></span>
          <strong data-t="liveData">게임 데이터 연동</strong>
          <small data-t="liveDataDesc">능력치는 현재 설정 기준입니다.</small>
        </div>
      </aside>

      <div id="page-content" class="page-content" tabindex="-1"></div>
    </section>
  </main>

  <footer>
    <a class="brand footer-brand" href="/wiki/"><span class="brand-mark">C</span><strong>COLORS</strong></a>
    <p data-t="footer">이 위키의 수치 정보는 게임 설정을 기준으로 자동 표시됩니다.</p>
    <a href="/index.html" data-t="backGame">게임으로 돌아가기 →</a>
  </footer>

  <dialog id="article-dialog">
    <button id="dialog-close" class="dialog-close" type="button" aria-label="닫기">×</button>
    <div id="dialog-content"></div>
  </dialog>

  <script type="module" src="./src/wiki.js?v=1"></script>
</body>
</html>
